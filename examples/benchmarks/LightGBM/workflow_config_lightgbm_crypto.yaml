qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn
market: &market ETHUSD
benchmark: &benchmark ETHUSD
data_handler_config: &data_handler_config
    class: CryptoCSVHandler
    module_path: qlib.contrib.data.crypto_csv_handler
    kwargs:
        csv_path: "<correct_path_to_file>/ETHUSD-15m-50wks-data.csv"  # Update this path
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 1
            n_drop: 0
    backtest:
        start_time: 2024-08-01
        end_time: 2025-06-27
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.2
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 0
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.9
            learning_rate: 0.1
            subsample: 0.9
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 250
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: CryptoCSVHandler
                module_path: qlib.contrib.data.crypto_csv_handler
                kwargs:
                    csv_path: "C:/Users/tangenning/Documents/GitHub/qlib/data/ETHUSD-15m-50wks-data.csv"  # Update this path
            segments:
                train: [2024-08-01, 2025-02-28]
                valid: [2025-03-01, 2025-04-30]
                test: [2025-05-01, 2025-06-27]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config